<dialog class="modal modal--therapy" id="modal-progress-update" aria-labelledby="modal-progress-update-title">
    <div class="modal__card modal__card--therapy">
      <div class="modal__header modal__header--assessment">
        <div class="modal__header-main">
          <span class="modal__header-icon">
            <img src="https://api.iconify.design/lucide/trending-up.svg?color=%230F3D30" alt="" width="22" height="22">
          </span>
          <div>
            <h3 id="modal-progress-update-title">Send progress update</h3>
            <p class="modal__subtitle" id="modal-progress-update-subtitle">Share a milestone with the child’s parent and care team.</p>
          </div>
        </div>
        <button type="button" class="modal__close modal__close--round" data-close-modal aria-label="Close">
          <img src="https://api.iconify.design/lucide/x.svg?color=%235C6775" alt="" width="18" height="18">
        </button>
      </div>

      <div class="modal__body modal__body--therapy">
        <div id="progress-modal-alert" class="alert" hidden role="alert"></div>

        <form id="progress-update-form">
          <section class="therapy-block">
            <h4 class="therapy-block__title">Child</h4>
            <div class="form-group">
              <label for="progress-update-child">Select child</label>
              <select id="progress-update-child" class="field-control" required>
                <option value="">Select a child…</option>
              </select>
            </div>
          </section>

          <section class="therapy-block">
            <h4 class="therapy-block__title">Update</h4>
            <div class="form-group">
              <label for="progress-update-title">Title</label>
              <input type="text" id="progress-update-title" class="field-control" maxlength="255" required placeholder="e.g. Naming objects independently">
            </div>
            <div class="form-group">
              <label for="progress-update-summary">Summary</label>
              <textarea id="progress-update-summary" class="field-control" rows="4" placeholder="Describe what improved and how the child responded…"></textarea>
            </div>
            <div class="therapy-grid">
              <div class="form-group">
                <label for="progress-update-milestone">Milestone (optional)</label>
                <input type="text" id="progress-update-milestone" class="field-control" maxlength="255" placeholder="e.g. Communication, Motor">
              </div>
              <div class="form-group">
                <label for="progress-update-date">Date</label>
                <input type="date" id="progress-update-date" class="field-control" required>
              </div>
            </div>
          </section>
        </form>
      </div>

      <div class="modal__footer modal__footer--assessment">
        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
        <div class="modal__footer-end">
          <button type="submit" form="progress-update-form" class="btn btn-primary" id="progress-update-submit">Send to parent</button>
        </div>
      </div>
    </div>
  </dialog>
