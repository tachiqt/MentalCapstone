<section id="section-therapy" class="section-panel" data-web-roles="head_doctor" aria-labelledby="therapy-heading">
          <h2 id="therapy-heading" class="visually-hidden">Therapy Sessions</h2>
          <div class="section-actions">
            <button type="button" class="btn btn-secondary" id="open-therapy-suggest" hidden>
              <img src="https://api.iconify.design/lucide/sparkles.svg?color=%230F3D30" alt="" width="16" height="16">
              Suggest schedule
            </button>
            <button type="button" class="btn btn-primary" id="open-therapy-schedule" hidden>+ Schedule session</button>
          </div>

          <div class="therapy-workspace">
            <div class="panel therapy-cal-panel">
              <div class="therapy-cal-toolbar">
                <div class="therapy-cal-nav">
                  <button type="button" class="icon-btn" id="therapy-cal-prev" aria-label="Previous">
                    <img src="https://api.iconify.design/lucide/chevron-left.svg?color=%230F4C4A" alt="" width="18" height="18">
                  </button>
                  <h3 class="therapy-cal-title" id="therapy-cal-title">Calendar</h3>
                  <button type="button" class="icon-btn" id="therapy-cal-next" aria-label="Next">
                    <img src="https://api.iconify.design/lucide/chevron-right.svg?color=%230F4C4A" alt="" width="18" height="18">
                  </button>
                </div>
                <div class="therapy-view-toggle" role="group" aria-label="Calendar view">
                  <button type="button" class="is-active" data-therapy-view="month">Month</button>
                  <button type="button" data-therapy-view="week">Week</button>
                  <button type="button" data-therapy-view="day">Day</button>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" id="therapy-cal-today">Today</button>
              </div>

              <div class="filter-bar therapy-cal-filters">
                <label class="search-field" for="therapy-search">
                  <span class="visually-hidden">Search sessions</span>
                  <input type="search" id="therapy-search" class="field-control field-control--search" placeholder="Search children, teachers, or plans…">
                </label>
                <select class="field-control" id="therapy-filter-child" aria-label="Filter by child">
                  <option value="">All children</option>
                </select>
                <select class="field-control" id="therapy-filter-teacher" aria-label="Filter by teacher">
                  <option value="">All teachers</option>
                </select>
                <select class="field-control" id="therapy-filter-type" aria-label="Filter by therapy type">
                  <option value="">All therapy types</option>
                </select>
              </div>

              <div id="therapy-loading" class="loading">Loading therapy sessions…</div>
              <div id="therapy-empty" class="empty-state" hidden>
                <h3>No sessions yet</h3>
                <p>Teachers schedule therapy sessions from the mobile app. This calendar is for oversight.</p>
                <button type="button" class="btn btn-primary" id="empty-open-therapy" hidden>+ Schedule session</button>
              </div>
              <div id="therapy-calendar" class="therapy-calendar" hidden></div>
              <div class="therapy-legend" id="therapy-legend" hidden>
                <span><i class="therapy-dot therapy-dot--scheduled"></i> Scheduled</span>
                <span><i class="therapy-dot therapy-dot--completed"></i> Completed</span>
                <span><i class="therapy-dot therapy-dot--cancelled"></i> Cancelled</span>
                <span><i class="therapy-dot therapy-dot--unlinked"></i> Unlinked</span>
              </div>
            </div>

            <aside class="panel therapy-agenda" id="therapy-agenda" aria-label="Upcoming sessions">
              <div class="therapy-agenda__head">
                <h3 class="panel-title">Upcoming</h3>
                <button type="button" class="icon-btn icon-btn--sm" id="therapy-agenda-toggle" aria-expanded="true" aria-controls="therapy-agenda-list" aria-label="Collapse upcoming sessions">
                  <img src="https://api.iconify.design/lucide/chevrons-right.svg?color=%230F4C4A" alt="" width="16" height="16">
                </button>
              </div>
              <div class="therapy-agenda__list" id="therapy-agenda-list"></div>
            </aside>
          </div>
        </section>
