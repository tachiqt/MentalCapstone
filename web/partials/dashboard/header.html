<header class="app-topbar">
  <button type="button" class="icon-btn topbar-menu" id="topbar-menu" aria-label="Open navigation" aria-controls="sidebar-inner" aria-expanded="false">
    <img src="https://api.iconify.design/lucide/menu.svg?color=%235C6775" alt="" width="18" height="18">
  </button>
  <div class="topbar-copy">
    <p class="topbar-title" id="topbar-title">Care overview</p>
    <p class="topbar-subtitle" id="topbar-subtitle">Sessions, reviews, and facility status</p>
  </div>
  <div class="topbar-search-wrap">
    <label class="topbar-search" for="global-search">
      <span class="visually-hidden">Search</span>
      <img class="topbar-search__ico" src="https://api.iconify.design/lucide/search.svg?color=%235C6775" alt="" width="16" height="16">
      <input type="search" id="global-search" placeholder="Search children, sessions, or staff…" autocomplete="off" aria-controls="global-search-results" aria-expanded="false">
    </label>
    <div id="global-search-results" class="search-popover" hidden role="listbox" aria-label="Search results"></div>
  </div>
  <div class="topbar-actions">
    <div class="topbar-notify-wrap">
      <button type="button" class="icon-btn topbar-notify" id="topbar-notify" aria-label="Notifications" title="Notifications" aria-expanded="false" aria-controls="notify-panel" aria-haspopup="dialog">
        <img src="https://api.iconify.design/lucide/bell.svg?color=%235C6775" alt="" width="18" height="18">
        <span class="notif-dot" id="topbar-notify-dot" hidden></span>
      </button>
      <div id="notify-panel" class="notify-panel" hidden role="dialog" aria-label="Notifications" aria-modal="false">
        <div class="notify-panel__head">
          <div>
            <h3>Notifications</h3>
            <p class="notify-panel__sub" id="notify-summary">Activity from your workspace</p>
          </div>
          <button type="button" class="btn-text notify-panel__mark" id="notify-mark-all" hidden>Mark all read</button>
        </div>
        <div id="notify-list" class="notify-panel__list"></div>
        <a href="notifications.html" id="notify-see-all" class="notify-panel__see-all" hidden>See all notifications</a>
      </div>
    </div>
    <button type="button" class="user-badge" id="user-badge" title="Open settings">Loading…</button>
  </div>
</header>
