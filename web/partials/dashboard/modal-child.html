<dialog class="modal modal--child" id="modal-child" aria-labelledby="modal-child-title">
    <div class="modal__card modal__card--assessment">
      <div class="modal__header modal__header--assessment">
        <div class="modal__header-main">
          <span class="modal__header-icon" aria-hidden="true">
            <img src="https://api.iconify.design/lucide/user-plus.svg?color=%230F3D30" alt="" width="22" height="22">
          </span>
          <div>
            <h3 id="modal-child-title">Register Child</h3>
            <p class="modal__subtitle" id="modal-child-subtitle">Add a patient profile to the facility registry.</p>
          </div>
        </div>
        <button type="button" class="modal__close modal__close--round" data-close-modal aria-label="Close">
          <img src="https://api.iconify.design/lucide/x.svg?color=%235C6775" alt="" width="18" height="18">
        </button>
      </div>

      <div class="modal__body modal__body--assessment">
        <div id="create-child-alert" class="alert" hidden role="alert"></div>
        <form id="create-child-form" class="assessment-form">
          <input type="hidden" id="child-edit-id" value="">

          <section class="assessment-section assessment-section--details" aria-labelledby="child-personal-title">
            <h4 id="child-personal-title" class="assessment-section__title">
              <img src="https://api.iconify.design/lucide/user-round.svg?color=%230F3D30" alt="" width="16" height="16">
              Personal details
            </h4>
            <div class="assessment-details-grid">
              <div class="form-group">
                <label for="child-first-name">First name</label>
                <input type="text" id="child-first-name" class="field-control" required placeholder="Liam">
              </div>
              <div class="form-group">
                <label for="child-last-name">Last name</label>
                <input type="text" id="child-last-name" class="field-control" required placeholder="Smith">
              </div>
              <div class="form-group">
                <label for="child-birth-date">Birth date</label>
                <input type="date" id="child-birth-date" class="field-control">
              </div>
              <div class="form-group">
                <label for="child-sex">Sex</label>
                <select id="child-sex" class="field-control">
                  <option value="">Prefer not to say</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
          </section>

          <section class="assessment-section assessment-section--details" aria-labelledby="child-clinical-title">
            <h4 id="child-clinical-title" class="assessment-section__title">
              <img src="https://api.iconify.design/lucide/stethoscope.svg?color=%230F3D30" alt="" width="16" height="16">
              Clinical information
            </h4>
            <div class="assessment-details-grid">
              <div class="form-group">
                <label for="child-age">Age (years)</label>
                <input type="number" id="child-age" class="field-control" min="1" max="100" step="1" placeholder="e.g. 22" autocomplete="off">
              </div>
              <div class="form-group">
                <label for="child-diagnosis">Diagnosis</label>
                <input type="text" id="child-diagnosis" class="field-control" placeholder="e.g. Autism spectrum — moderate support" autocomplete="off">
              </div>
              <div class="form-group" style="grid-column: 1 / -1;">
                <label for="child-notes">Condition notes</label>
                <textarea id="child-notes" class="field-control field-control--autosize" rows="3" placeholder="Clinical notes, alerts, or context"></textarea>
              </div>
            </div>
          </section>

          <section class="assessment-section assessment-section--details" aria-labelledby="child-care-team-title">
            <h4 id="child-care-team-title" class="assessment-section__title">
              <img src="https://api.iconify.design/lucide/users-round.svg?color=%230F3D30" alt="" width="16" height="16">
              Care team
            </h4>
            <p class="form-hint" style="margin-top:0">Assign accounts separately — teacher, parent, and caretaker are independent roles.</p>
            <div class="assessment-details-grid child-care-team-grid">
              <div class="form-group">
                <label for="child-assign-teacher">Teacher</label>
                <select id="child-assign-teacher" class="field-control">
                  <option value="">No teacher assigned…</option>
                </select>
              </div>
              <div class="form-group">
                <label for="child-assign-parent">Parent</label>
                <select id="child-assign-parent" class="field-control">
                  <option value="">No parent assigned…</option>
                </select>
              </div>
              <div class="form-group">
                <label for="child-assign-caretaker">Caretaker</label>
                <select id="child-assign-caretaker" class="field-control">
                  <option value="">No caretaker assigned…</option>
                </select>
              </div>
              <div class="form-group" style="grid-column: 1 / -1;">
                <label class="check-inline" for="child-is-active">
                  <input type="checkbox" id="child-is-active" checked>
                  <span>Active in facility registry</span>
                </label>
              </div>
            </div>
          </section>
        </form>
      </div>

      <div class="modal__footer modal__footer--assessment">
        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
        <div class="modal__footer-end">
          <button type="submit" class="btn btn-primary" id="child-submit-btn" form="create-child-form">Register Child</button>
        </div>
      </div>
    </div>
  </dialog>
