<dialog class="modal modal--assign" id="modal-assign" aria-labelledby="modal-assign-title">
  <div class="modal__card modal__card--assessment">
    <div class="modal__header modal__header--assessment">
      <div class="modal__header-main">
        <span class="modal__header-icon" aria-hidden="true">
          <img src="https://api.iconify.design/lucide/user-check.svg?color=%230F3D30" alt="" width="22" height="22">
        </span>
        <div>
          <h3 id="modal-assign-title">Assign children to care team</h3>
          <p class="modal__subtitle" id="modal-assign-subtitle">Choose a role and account, then select one or more children.</p>
        </div>
      </div>
      <button type="button" class="modal__close modal__close--round" data-close-modal aria-label="Close">
        <img src="https://api.iconify.design/lucide/x.svg?color=%235C6775" alt="" width="18" height="18">
      </button>
    </div>

    <div class="modal__body modal__body--assessment">
      <div id="assign-alert" class="alert" hidden role="alert"></div>
      <form id="assign-form" class="assessment-form">
        <section class="assessment-section assessment-section--details">
          <h4 class="assessment-section__title">
            <img src="https://api.iconify.design/lucide/badge-check.svg?color=%230F3D30" alt="" width="16" height="16">
            Role &amp; account
          </h4>
          <div class="assessment-details-grid">
            <div class="form-group">
              <label for="assign-relation">Care role</label>
              <select id="assign-relation" class="field-control" required>
                <option value="teacher">Teacher</option>
                <option value="parent">Parent</option>
                <option value="caretaker">Caretaker</option>
              </select>
            </div>
            <div class="form-group">
              <label for="assign-user" id="assign-user-label">Account</label>
              <select id="assign-user" class="field-control" required>
                <option value="">Select an account…</option>
              </select>
              <p class="form-hint" id="assign-user-hint">Assigned children appear on that account’s mobile app after save.</p>
            </div>
          </div>
        </section>

        <section class="assessment-section assessment-section--details">
          <div class="assign-children-head">
            <h4 class="assessment-section__title">
              <img src="https://api.iconify.design/lucide/users.svg?color=%230F3D30" alt="" width="16" height="16">
              Children
            </h4>
            <div class="assign-children-tools">
              <button type="button" class="btn-text" id="assign-select-all">Select all</button>
              <button type="button" class="btn-text" id="assign-clear-all">Clear</button>
            </div>
          </div>
          <label class="registry-search" for="assign-children-search">
            <img src="https://api.iconify.design/lucide/search.svg?color=%235C6775" alt="" width="16" height="16">
            <span class="visually-hidden">Search children</span>
            <input type="search" id="assign-children-search" placeholder="Search children…">
          </label>
          <div id="assign-children-list" class="assign-children-list" role="group" aria-label="Children to assign"></div>
        </section>
      </form>
    </div>

    <div class="modal__footer modal__footer--assessment">
      <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
      <div class="modal__footer-end">
        <button type="submit" class="btn btn-primary" id="assign-submit-btn" form="assign-form">Assign children</button>
      </div>
    </div>
  </div>
</dialog>
