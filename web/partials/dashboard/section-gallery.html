<section id="section-gallery" class="section-panel" data-web-roles="head_doctor,psychometrician" aria-labelledby="gallery-heading">
          <h2 id="gallery-heading" class="visually-hidden">Gallery</h2>

          <div class="panel library-panel gallery-panel">
            <div class="panel-toolbar panel-toolbar--library">
              <div class="panel-toolbar__start">
                <span class="panel-toolbar__icon" aria-hidden="true">
                  <img src="https://api.iconify.design/lucide/images.svg?color=%230F4C4A" alt="" width="20" height="20">
                </span>
                <div>
                  <h3 class="panel-title" id="gallery-panel-title">Facility albums</h3>
                  <p class="panel-toolbar__hint" id="gallery-panel-hint">Facility photo albums and per-child auto albums.</p>
                </div>
              </div>
              <div class="panel-toolbar__end gallery-toolbar-actions">
                <button type="button" class="btn btn-primary btn-sm" id="gallery-new-album-btn">New album</button>
                <span class="count-chip" id="gallery-toolbar-count">0</span>
              </div>
            </div>

            <div id="gallery-albums-view">
              <div id="gallery-albums-loading" class="loading" hidden>Loading albums…</div>
              <div id="gallery-albums-empty" class="gallery-empty" hidden>No albums yet. Create a facility album to get started.</div>
              <div id="gallery-albums-grid" class="gallery-albums-grid" role="list"></div>
            </div>

            <div id="gallery-album-view" hidden>
              <div class="gallery-album-toolbar">
                <button type="button" class="btn btn-secondary btn-sm" id="gallery-back-albums">
                  ← Back to albums
                </button>
                <div class="gallery-album-toolbar__meta">
                  <h4 id="gallery-album-title" class="gallery-album-title">Album</h4>
                  <p id="gallery-album-subtitle" class="profile-item__meta"></p>
                </div>
                <div class="gallery-album-toolbar__actions" id="gallery-custom-actions" hidden>
                  <label class="btn btn-primary btn-sm">
                    Upload photos
                    <input type="file" id="gallery-upload-input" hidden accept=".jpg,.jpeg,.png,image/jpeg,image/png" multiple>
                  </label>
                  <button type="button" class="btn btn-secondary btn-sm" id="gallery-rename-btn">Rename</button>
                  <button type="button" class="btn btn-secondary btn-sm" id="gallery-delete-btn">Delete album</button>
                </div>
              </div>
              <div id="gallery-photos-loading" class="loading" hidden>Loading photos…</div>
              <div id="gallery-photos-empty" class="gallery-empty" hidden>No photos in this album yet.</div>
              <div id="gallery-photos-grid" class="gallery-photos-grid" role="list"></div>
              <div id="gallery-photos-pager" class="profile-list-pagination" hidden></div>
            </div>
          </div>

          <dialog class="modal modal--gallery-album" id="modal-gallery-new-album" aria-labelledby="gallery-new-album-title">
            <div class="modal__card modal__card--gallery-album">
              <div class="modal__header">
                <h3 id="gallery-new-album-title">New album</h3>
                <button type="button" class="modal__close modal__close--round" data-close-modal="modal-gallery-new-album" aria-label="Close">
                  <img src="https://api.iconify.design/lucide/x.svg?color=%235C6775" alt="" width="18" height="18">
                </button>
              </div>
              <form id="gallery-new-album-form" class="modal__body modal__body--gallery-album form-stack">
                <label class="field">
                  <span class="field__label">Album name</span>
                  <input type="text" id="gallery-new-album-name" class="field-control" maxlength="120" required placeholder="e.g. Facility events, Open house">
                </label>
                <p id="gallery-new-album-alert" class="form-alert" hidden></p>
                <div class="form-actions form-actions--end">
                  <button type="button" class="btn btn-secondary" data-close-modal="modal-gallery-new-album">Cancel</button>
                  <button type="submit" class="btn btn-primary" id="gallery-new-album-submit">Create album</button>
                </div>
              </form>
            </div>
          </dialog>

          <dialog class="modal modal--gallery-lightbox" id="modal-gallery-lightbox" aria-label="Photo preview">
            <div class="modal__card modal__card--gallery-lightbox">
              <div class="modal__header">
                <h3 id="gallery-lightbox-caption">Photo</h3>
                <button type="button" class="modal__close modal__close--round" id="gallery-lightbox-close" aria-label="Close preview">
                  <img src="https://api.iconify.design/lucide/x.svg?color=%235C6775" alt="" width="18" height="18">
                </button>
              </div>
              <div class="modal__body gallery-lightbox-body">
                <img id="gallery-lightbox-image" class="gallery-lightbox-image" alt="">
                <p id="gallery-lightbox-meta" class="profile-item__meta"></p>
              </div>
            </div>
          </dialog>
        </section>
