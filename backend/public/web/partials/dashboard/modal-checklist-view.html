<dialog class="modal modal--checklist" id="modal-checklist-view" aria-labelledby="modal-checklist-view-title">
    <div class="modal__card modal__card--assessment">
      <div class="modal__header modal__header--assessment">
        <div class="modal__header-main">
          <span class="modal__header-icon" aria-hidden="true">
            <img src="https://api.iconify.design/lucide/clipboard-list.svg?color=%230F3D30" alt="" width="22" height="22">
          </span>
          <div>
            <h3 id="modal-checklist-view-title">Checklist details</h3>
            <p class="modal__subtitle" id="modal-checklist-view-meta"></p>
          </div>
        </div>
        <button type="button" class="modal__close modal__close--round" data-close-modal aria-label="Close">
          <img src="https://api.iconify.design/lucide/x.svg?color=%235C6775" alt="" width="18" height="18">
        </button>
      </div>

      <div class="modal__body modal__body--assessment">
        <div id="modal-checklist-view-summary"></div>
        <section class="assessment-section assessment-section--responses" aria-labelledby="checklist-view-items-title">
          <div class="assessment-section__head">
            <h4 id="checklist-view-items-title" class="assessment-section__title">
              <img src="https://api.iconify.design/lucide/list-checks.svg?color=%230F3D30" alt="" width="16" height="16">
              Observation items
            </h4>
            <p class="assessment-section__hint">Prompts scored 0–3 during assessments. Hints are reviewer cues only.</p>
          </div>
          <div class="assessment-response-list" id="modal-checklist-view-items"></div>
        </section>
      </div>

      <div class="modal__footer modal__footer--assessment">
        <button type="button" class="btn btn-secondary" data-close-modal>Close</button>
        <div class="modal__footer-end">
          <button type="button" class="btn btn-primary" id="checklist-view-use-btn">Use in assessment</button>
        </div>
      </div>
    </div>
  </dialog>
