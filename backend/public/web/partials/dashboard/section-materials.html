<section id="section-materials" class="section-panel" data-web-roles="head_doctor" aria-labelledby="materials-heading">
          <h2 id="materials-heading" class="visually-hidden">Resource Library</h2>
          <div class="section-actions">
            <button type="button" class="btn btn-primary" id="open-material">+ Add material</button>
          </div>

          <div class="panel library-panel materials-panel">
            <div class="panel-toolbar panel-toolbar--library">
              <div class="panel-toolbar__start">
                <span class="panel-toolbar__icon" aria-hidden="true">
                  <img src="https://api.iconify.design/lucide/book-open.svg?color=%230F4C4A" alt="" width="20" height="20">
                </span>
                <div>
                  <h3 class="panel-title">Resource library</h3>
                  <p class="panel-toolbar__hint" id="materials-summary-line">Upload guides and therapy resources for AI and classroom use</p>
                </div>
              </div>
              <span class="count-chip" id="materials-toolbar-count">0</span>
            </div>
            <div class="filter-bar staff-filters">
              <label class="search-field" for="materials-search">
                <span class="visually-hidden">Search materials</span>
                <input type="search" id="materials-search" class="field-control field-control--search" placeholder="Search title, tags, or description…">
              </label>
              <select class="field-control" id="materials-filter-type" aria-label="Filter by type">
                <option value="">All types</option>
                <option value="worksheet">Worksheet</option>
                <option value="visual">Visual aid</option>
                <option value="video">Video</option>
                <option value="audio">Audio</option>
                <option value="activity">Activity</option>
                <option value="guide">Guide</option>
              </select>
              <select class="field-control" id="materials-filter-file" aria-label="Filter by file">
                <option value="">All files</option>
                <option value="with_file">With file</option>
                <option value="metadata">Metadata only</option>
              </select>
            </div>
            <div id="materials-loading" class="loading">Loading materials…</div>
            <div id="materials-empty" class="empty-state" hidden>
              <h3>No materials yet</h3>
              <p>Upload guides and therapy resources so AI recommendations can suggest them.</p>
              <button type="button" class="btn btn-primary" id="empty-open-material">+ Add material</button>
            </div>
            <div class="data-table-wrap staff-table-wrap" id="materials-table-wrap" hidden>
              <table class="staff-table" aria-label="Learning materials">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Tags</th>
                    <th>File</th>
                    <th>Uploaded</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="materials-tbody"></tbody>
              </table>
            </div>
            <nav class="list-pagination" id="materials-pagination" hidden aria-label="Resource library pagination">
              <button type="button" class="btn btn-secondary btn-sm" id="materials-page-prev">Previous</button>
              <p class="list-pagination__meta" id="materials-page-meta">Page 1</p>
              <button type="button" class="btn btn-secondary btn-sm" id="materials-page-next">Next</button>
            </nav>
          </div>
        </section>
