<dialog class="modal modal--child-status" id="modal-child-status" aria-labelledby="modal-child-status-title">
    <div class="modal__card modal__card--child-status">
      <div class="modal__header modal__header--assessment">
        <div class="modal__header-main">
          <span class="modal__header-icon" aria-hidden="true" id="modal-child-status-icon-wrap">
            <img src="https://api.iconify.design/lucide/shield-alert.svg?color=%230F3D30" alt="" width="22" height="22" id="modal-child-status-icon">
          </span>
          <div>
            <h3 id="modal-child-status-title">Confirm status change</h3>
            <p class="modal__subtitle" id="modal-child-status-subtitle">Review before continuing.</p>
          </div>
        </div>
        <button type="button" class="modal__close modal__close--round" data-close-modal aria-label="Close">
          <img src="https://api.iconify.design/lucide/x.svg?color=%235C6775" alt="" width="18" height="18">
        </button>
      </div>

      <div class="modal__body modal__body--child-status">
        <div id="child-status-alert" class="alert" hidden role="alert"></div>
        <div class="therapy-confirm therapy-confirm--compact">
          <p class="therapy-confirm__copy" id="child-status-copy">Confirm this action?</p>
          <p class="therapy-confirm__hint" id="child-status-hint"></p>
          <div class="form-group form-group--child-status-note">
            <label for="child-status-note">Note (optional)</label>
            <textarea id="child-status-note" class="field-control" rows="2" placeholder="Reason for this change…"></textarea>
          </div>
        </div>
      </div>

      <div class="modal__footer modal__footer--assessment">
        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
        <div class="modal__footer-end">
          <button type="button" class="btn btn-primary" id="child-status-commit">Confirm</button>
        </div>
      </div>
    </div>
  </dialog>
