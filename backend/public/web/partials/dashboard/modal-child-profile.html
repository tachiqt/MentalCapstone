<dialog class="modal modal--profile" id="modal-child-profile" aria-labelledby="modal-child-profile-title">
    <div class="modal__card modal__card--assessment">
      <div class="modal__header modal__header--assessment">
        <div class="modal__header-main">
          <span class="modal__header-icon" aria-hidden="true">
            <img src="https://api.iconify.design/lucide/id-card.svg?color=%230F3D30" alt="" width="22" height="22">
          </span>
          <div>
            <h3 id="modal-child-profile-title">Child profile</h3>
            <p class="modal__subtitle" id="modal-child-profile-meta"></p>
          </div>
        </div>
        <button type="button" class="modal__close modal__close--round" data-close-modal aria-label="Close">
          <img src="https://api.iconify.design/lucide/x.svg?color=%235C6775" alt="" width="18" height="18">
        </button>
      </div>

      <div class="modal__body modal__body--assessment">
        <div id="child-profile-alert" class="alert" hidden role="alert"></div>
        <div id="child-profile-loading" class="loading">Loading child profile…</div>
        <div id="child-profile-content" hidden>
          <div class="profile-hero" id="child-profile-summary"></div>
          <div class="profile-tabs" role="tablist" aria-label="Child profile sections">
            <button type="button" class="profile-tab is-active" role="tab" aria-selected="true" data-profile-tab="overview">Overview</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" data-profile-tab="assessments">Assessments</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" data-profile-tab="recommendations" aria-label="AI recommendations">AI recs</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" data-profile-tab="medications">Medications</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" data-profile-tab="materials" aria-label="Learning materials">Materials</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" data-profile-tab="progress">Progress</button>
          </div>
          <div class="profile-panes">
            <section class="profile-pane is-active" data-profile-pane="overview" role="tabpanel"></section>
            <section class="profile-pane" data-profile-pane="assessments" role="tabpanel" hidden></section>
            <section class="profile-pane" data-profile-pane="recommendations" role="tabpanel" hidden></section>
            <section class="profile-pane" data-profile-pane="medications" role="tabpanel" hidden></section>
            <section class="profile-pane" data-profile-pane="materials" role="tabpanel" hidden></section>
            <section class="profile-pane" data-profile-pane="progress" role="tabpanel" hidden></section>
          </div>
        </div>
      </div>

      <div class="modal__footer modal__footer--assessment">
        <button type="button" class="btn btn-secondary" data-close-modal>Close</button>
        <div class="modal__footer-end">
          <button type="button" class="btn btn-secondary" id="child-profile-edit-btn">
            <img src="https://api.iconify.design/lucide/pencil.svg?color=%230F3D30" alt="" width="16" height="16">
            Edit demographics
          </button>
          <button type="button" class="btn btn-primary" id="child-profile-assess-btn">
            <img src="https://api.iconify.design/lucide/clipboard-list.svg?color=%23FFFFFF" alt="" width="16" height="16">
            Submit assessment
          </button>
        </div>
      </div>
    </div>
  </dialog>
